server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Actuals uploads are limited to 5 MB by planning-service; allow a little overhead for the multipart wrapper.
    client_max_body_size 6m;

    # API calls go to planning-service on the Docker network, so the browser only ever talks to this one origin
    # (the same role the Vite dev proxy plays in development; no CORS needed).
    location /api/ {
        proxy_pass http://planning-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI commentary can wait up to 150 s for the language model before falling back.
        proxy_read_timeout 180s;
    }

    # planning-service's interactive API docs (Swagger UI and the OpenAPI spec).
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://planning-service:8080;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths fall back to index.html so client-side routes work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
