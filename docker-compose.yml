# Phase 0: database only. Application services are added to this file in Phase 6.
services:
  postgres:
    image: postgres:17-alpine
    container_name: driverline-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-driverline}
      POSTGRES_USER: ${POSTGRES_USER:-driverline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driverline}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
