spring:
  application:
    name: planning-service
  datasource:
    # Defaults match docker-compose.yml for local development only. Real environments must set these variables.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/driverline}
    username: ${DB_USERNAME:driverline}
    password: ${DB_PASSWORD:driverline}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  servlet:
    multipart:
      # Actuals files for a small company are tiny; reject anything unreasonably large early.
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PLANNING_SERVICE_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

commentary:
  # The commentary-service that writes plain-English variance commentary.
  service-url: ${COMMENTARY_SERVICE_URL:http://localhost:8082}
  # Longer than commentary-service's own language model timeout (120s), so its rule-based fallback can answer first.
  timeout: ${COMMENTARY_TIMEOUT_SECONDS:150}s

driverline:
  seed:
    # Loads the fictional Ace Janitorial Service into an empty database on startup.
    demo-data: ${SEED_DEMO_DATA:true}
